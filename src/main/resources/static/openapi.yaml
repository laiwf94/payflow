openapi: 3.1.0
info:
  title: payflow
  version: 0.1.0
  description: |
    Payment orchestration for orders. Creating an order starts a saga that reserves stock,
    authorizes and captures the payment and books the shipment, undoing earlier steps when a
    later one fails. Amounts are integers in the currency's minor units (1999 EUR is 19.99 euro).

    Every POST needs an `Idempotency-Key`. Retrying with the same key and body returns the first
    response, errors included.

    Every error has the same body, `{"error":{"code","message","request_id"}}`. Codes are
    stable, and each response below lists the ones it can carry in `x-error-codes`; messages
    are for people and may change. Besides those, any request can be answered with one of
    these, listed in the top-level `x-error-codes`:

    | Status | Code | When |
    |---|---|---|
    | 404 | `not_found` | No such endpoint. |
    | 405 | `method_not_allowed` | The endpoint exists, but not with this method. |
    | 406 | `not_acceptable` | The `Accept` header rules out `application/json`. |
    | 500 | `internal` | An unexpected failure. Safe to retry with the same key. |
    | 503 | `unavailable` | The database is unreachable. Safe to retry with the same key. |

    Every response carries `X-Request-Id`: the caller's own if it sent a plain one, otherwise a
    fresh one. It is also the `request_id` of an error and follows the order into its events.
  license:
    name: MIT
x-error-codes: [not_found, method_not_allowed, not_acceptable, internal, unavailable]
servers:
  - url: http://localhost:8080
security:
  - apiKey: []
paths:
  /v1/orders:
    get:
      operationId: listOrders
      summary: List the merchant's orders, newest first
      description: |
        Orders run newest first by creation time, a page at a time. When `has_more` is true,
        pass `next_cursor` back as `cursor` with the same filters to get the next page; `limit`
        may change between pages. Orders created while you page don't shift the rest: every
        order that matched when you started is returned exactly once.

        The cursor is opaque and signed over the merchant and the filters, so it can't be built
        by hand, used by another merchant or carried to a listing with other filters. Unknown or
        repeated parameters are refused rather than ignored.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: limit
          in: query
          description: Orders per page, 1-100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: The `next_cursor` of the previous page.
          schema:
            type: string
        - name: state
          in: query
          description: |
            Only orders in these states. Repeat the parameter or separate states with commas.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/OrderState'
        - name: created_gte
          in: query
          description: Only orders created at or after this RFC 3339 time.
          schema:
            type: string
            format: date-time
        - name: created_lt
          in: query
          description: Only orders created before this RFC 3339 time.
          schema:
            type: string
            format: date-time
        - name: currency
          in: query
          schema:
            type: string
            pattern: '^[A-Z]{3}$'
        - name: merchant_reference
          in: query
          description: The order with this reference, if there is one.
          schema:
            type: string
            pattern: '^[!-~]{1,128}$'
      responses:
        '200':
          description: One page of orders.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderList'
        '400':
          $ref: '#/components/responses/ListInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      operationId: createOrder
      summary: Create an order and start its saga
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrder'
      responses:
        '201':
          description: Created. The order starts in PENDING; poll it or read its events.
          headers:
            Location:
              required: true
              description: The order's path.
              schema:
                type: string
                pattern: '^/v1/orders/[0-9a-f-]{36}$'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/CreateConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/KeyReused'
  /v1/orders/{id}:
    get:
      operationId: getOrder
      summary: Get an order
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The order.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/orders/{id}/cancel:
    post:
      operationId: cancelOrder
      summary: Cancel an order that hasn't been captured yet
      description: |
        Accepted when the order is PENDING, INVENTORY_RESERVED or PAYMENT_AUTHORIZED. The saga
        stops at its next step, releases what it reserved and ends in CANCELLED.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '202':
          description: Cancel requested.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/CancelConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/KeyReused'
  /v1/orders/{id}/refund:
    post:
      operationId: refundOrder
      summary: Refund what is left of a completed order's capture
      description: >-
        Starts one refund of everything no other refund has returned or is returning. The refund
        runs in the background: the order stays as it is until the provider has returned the money,
        then becomes `REFUNDED`. Asking again while that refund is pending starts nothing new and
        answers 202 again.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '202':
          description: Refund started, or already pending; the order as it is now.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RefundConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/KeyReused'
  /v1/orders/{id}/refunds:
    post:
      operationId: createRefund
      summary: Refund an amount or some of a completed order's goods
      description: |
        Give exactly one of `amount` or `lines`. An amount refund returns that much of the
        capture. A line refund gives goods back: its amount is what the order paid for those
        units, and units of a sku sold on several lines come back from the first line first.

        Every refund that hasn't failed counts against the order, pending ones included, so
        refunds racing each other can never return more than was captured
        (`refund_exceeds_captured`) or more of a sku than was bought (`refund_exceeds_purchased`).
        The database checks both again at commit.

        The refund runs in the background. It is answered `PENDING`; the order becomes
        `PARTIALLY_REFUNDED` or `REFUNDED` once the provider has returned the money. A refund the
        provider refuses ends `FAILED` with its reason and gives its share back.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRefund'
      responses:
        '202':
          description: Refund started; it is `PENDING`.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RefundsConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/KeyReused'
    get:
      operationId: listRefunds
      summary: List an order's refunds, oldest first
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Every refund of the order, in every state.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Refund'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/orders/{id}/events:
    get:
      operationId: getOrderEvents
      summary: The order's history, as recorded from its events
      description: Built by an event consumer, so it can trail the order by a moment.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Events in order.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TimelineEntry'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/webhook_endpoints:
    post:
      operationId: createWebhookEndpoint
      summary: Register a webhook endpoint
      description: |
        Registers a URL to receive the merchant's events, enabled at once. `enabled_events` is
        `["*"]` for every event type, including ones added later, or a list of types.

        The answer carries the endpoint's signing `secret`. It is shown this once and never
        again: store it to verify deliveries. payflow keeps it encrypted at rest. A merchant can
        have at most 16 endpoints (`webhook_endpoint_limit_reached`).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookEndpoint'
      responses:
        '201':
          description: Registered. The only answer that shows the secret.
          headers:
            Location:
              required: true
              description: The endpoint's path.
              schema:
                type: string
                pattern: '^/v1/webhook_endpoints/[0-9a-f-]{36}$'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedWebhookEndpoint'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/WebhookCreateConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/KeyReused'
    get:
      operationId: listWebhookEndpoints
      summary: List the merchant's webhook endpoints, oldest first
      description: Every endpoint the merchant has, at most 16, so there are no pages.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The endpoints, without their secrets.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: array
                    maxItems: 16
                    items:
                      $ref: '#/components/schemas/WebhookEndpoint'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /v1/webhook_endpoints/{id}:
    get:
      operationId: getWebhookEndpoint
      summary: Get a webhook endpoint
      parameters:
        - $ref: '#/components/parameters/WebhookEndpointId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The endpoint, without its secret.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpoint'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/WebhookEndpointNotFound'
    post:
      operationId: updateWebhookEndpoint
      summary: Change a webhook endpoint
      description: |
        Each field given replaces the stored one; at least one is needed. An empty `description`
        clears it. A `DISABLED` endpoint keeps its settings but receives nothing until it is
        enabled again. The secret doesn't change.
      parameters:
        - $ref: '#/components/parameters/WebhookEndpointId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWebhookEndpoint'
      responses:
        '200':
          description: The endpoint as it now is.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpoint'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/WebhookEndpointNotFound'
        '409':
          $ref: '#/components/responses/KeyInUse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/KeyReused'
    delete:
      operationId: deleteWebhookEndpoint
      summary: Delete a webhook endpoint
      description: |
        The endpoint receives nothing more and its secret is erased. Deleting it again answers
        404.
      parameters:
        - $ref: '#/components/parameters/WebhookEndpointId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Deleted.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, deleted]
                properties:
                  id:
                    type: string
                    format: uuid
                  deleted:
                    type: boolean
                    description: Always `true`.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/WebhookEndpointNotFound'
  /v1/webhook_endpoints/{id}/deliveries:
    get:
      operationId: listWebhookDeliveries
      summary: The endpoint's delivery log, newest first
      description: |
        Every event sent, or still to be sent, to the endpoint, with the outcome of its latest
        attempt: the HTTP status, how long it took and the first 1,024 characters of the
        answer's body, or why there was no answer (`connect`, `timeout`, `address_refused` and
        so on). Pages and cursors work as on `GET /v1/orders`; the cursor is also bound to this
        endpoint. Time bounds are on when the delivery was created, which is when payflow
        published the event.
      parameters:
        - $ref: '#/components/parameters/WebhookEndpointId'
        - $ref: '#/components/parameters/RequestId'
        - name: limit
          in: query
          description: Deliveries per page, 1-100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: The `next_cursor` of the previous page.
          schema:
            type: string
        - name: state
          in: query
          description: |
            Only deliveries in these states. Repeat the parameter or separate states with commas.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/WebhookDeliveryState'
        - name: event_id
          in: query
          description: Only the delivery of this event.
          schema:
            type: string
            format: uuid
        - name: created_gte
          in: query
          description: Only deliveries created at or after this RFC 3339 time.
          schema:
            type: string
            format: date-time
        - name: created_lt
          in: query
          description: Only deliveries created before this RFC 3339 time.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: One page of the log.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDeliveryList'
        '400':
          $ref: '#/components/responses/ListInvalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/WebhookLogNotFound'
  /v1/webhook_endpoints/{id}/deliveries/{delivery_id}:
    get:
      operationId: getWebhookDelivery
      summary: One delivery, with the event it carries and every attempt
      parameters:
        - $ref: '#/components/parameters/WebhookEndpointId'
        - $ref: '#/components/parameters/WebhookDeliveryId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The delivery.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDeliveryDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/WebhookLogNotFound'
  /v1/webhook_endpoints/{id}/replay:
    post:
      operationId: replayWebhookDeliveries
      summary: Send deliveries to the endpoint again
      description: |
        Makes the endpoint's settled deliveries (`SUCCEEDED` or `FAILED`) due again at once: the
        one for `event_id`, or those created in `[created_gte, created_lt)`, optionally only in
        the given states. Each is sent with the same body, a new signature and the next attempt
        number, and retried as a new event would be, for 3 days from the replay. Deliveries
        still `PENDING` are left alone and counted in `already_pending`, since they will be sent
        anyway. One replay covers at most 1,000 deliveries; a range with more is refused with
        `invalid_argument` and nothing is replayed, so narrow it. A disabled endpoint's
        replayed deliveries wait until it is enabled again.
      parameters:
        - $ref: '#/components/parameters/WebhookEndpointId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplayWebhookDeliveries'
      responses:
        '200':
          description: What was replayed.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [replayed, already_pending]
                properties:
                  replayed:
                    type: integer
                    minimum: 0
                    maximum: 1000
                    description: Settled deliveries made due again.
                  already_pending:
                    type: integer
                    minimum: 0
                    description: Matching deliveries that were pending and were left alone.
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/WebhookLogNotFound'
        '409':
          $ref: '#/components/responses/KeyInUse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/KeyReused'
  /v1/webhook_endpoints/{id}/ping:
    post:
      operationId: pingWebhookEndpoint
      summary: Send the endpoint a test ping
      description: |
        Queues a `ping` event to the endpoint, whatever event types it subscribes to. It is sent
        in the background within a moment, signed like every event, with
        `Payflow-Event-Type: ping`. It is tried once, not retried, and appears in the delivery
        log; `Location` points to it, so poll that for the answer. Its body is
        `{"event_id","event_type":"ping","merchant_id","endpoint_id","created_at"}` and it has no
        `order_id`. A disabled endpoint can't be pinged (`invalid_argument`).
      parameters:
        - $ref: '#/components/parameters/WebhookEndpointId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '202':
          description: Queued.
          headers:
            Location:
              required: true
              description: The ping's delivery.
              schema:
                type: string
                pattern: '^/v1/webhook_endpoints/[0-9a-f-]{36}/deliveries/[0-9a-f-]{36}$'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDelivery'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/WebhookLogNotFound'
        '409':
          $ref: '#/components/responses/KeyInUse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/KeyReused'
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: A merchant API key from `payflow keygen`.
  parameters:
    OrderId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WebhookEndpointId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WebhookDeliveryId:
      name: delivery_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 1-255 printable ASCII characters without spaces. Kept for 24 hours.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Correlation id, echoed back and carried through logs and events.
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]{1,64}$'
  headers:
    RequestId:
      required: true
      description: The request's correlation id; see `X-Request-Id` above.
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]{1,64}$'
    IdempotentReplayed:
      description: |
        Present, and `true`, when this is the stored answer to an earlier request with the same
        Idempotency-Key rather than a new one. The body is that first answer as it was, so an
        error's `request_id` is the first request's; `X-Request-Id` is this request's.
      schema:
        type: string
        enum: ['true']
  responses:
    InvalidArgument:
      description: The request is malformed or a field is invalid (`invalid_argument`).
      x-error-codes: [invalid_argument]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Idempotent-Replayed:
          $ref: '#/components/headers/IdempotentReplayed'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ListInvalid:
      description: |
        A query parameter is unknown, repeated or invalid (`invalid_argument`), or the cursor is
        malformed or belongs to another listing (`invalid_cursor`; start again without one).
      x-error-codes: [invalid_argument, invalid_cursor]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: Missing or invalid API key (`unauthenticated`).
      x-error-codes: [unauthenticated]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        WWW-Authenticate:
          required: true
          schema:
            type: string
            enum: [Bearer]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No such order for this merchant (`not_found`).
      x-error-codes: [not_found]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Idempotent-Replayed:
          $ref: '#/components/headers/IdempotentReplayed'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CancelConflict:
      description: |
        The order has been captured, or has already ended, so it can't be cancelled
        (`order_not_cancellable`; refund it once it completes), or a request with this
        Idempotency-Key is still running (`idempotency_key_in_use`).
      x-error-codes: [order_not_cancellable, idempotency_key_in_use]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Idempotent-Replayed:
          $ref: '#/components/headers/IdempotentReplayed'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RefundConflict:
      description: |
        Only a COMPLETED or PARTIALLY_REFUNDED order with money left to refund can be refunded
        (`order_not_refundable`), or a request with this Idempotency-Key is still running
        (`idempotency_key_in_use`).
      x-error-codes: [order_not_refundable, idempotency_key_in_use]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Idempotent-Replayed:
          $ref: '#/components/headers/IdempotentReplayed'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RefundsConflict:
      description: |
        Only a COMPLETED or PARTIALLY_REFUNDED order with money left to refund can be refunded
        (`order_not_refundable`). Counting every refund that hasn't failed, the refund asks for
        more money than is left of the capture (`refund_exceeds_captured`) or more of a sku than
        is left of what the order bought (`refund_exceeds_purchased`); the message says how much
        is left. Or a request with this Idempotency-Key is still running
        (`idempotency_key_in_use`).
      x-error-codes:
        [order_not_refundable, refund_exceeds_captured, refund_exceeds_purchased,
         idempotency_key_in_use]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Idempotent-Replayed:
          $ref: '#/components/headers/IdempotentReplayed'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CreateConflict:
      description: |
        Either the merchant already has an order with this `merchant_reference`
        (`order_reference_in_use`; the message names that order, and retrying with the same
        Idempotency-Key replays this answer), or a request with this Idempotency-Key is still
        running (`idempotency_key_in_use`).
      x-error-codes: [order_reference_in_use, idempotency_key_in_use]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Idempotent-Replayed:
          $ref: '#/components/headers/IdempotentReplayed'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    WebhookCreateConflict:
      description: |
        The merchant already has 16 webhook endpoints (`webhook_endpoint_limit_reached`; delete
        one first), or a request with this Idempotency-Key is still running
        (`idempotency_key_in_use`).
      x-error-codes: [webhook_endpoint_limit_reached, idempotency_key_in_use]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Idempotent-Replayed:
          $ref: '#/components/headers/IdempotentReplayed'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    WebhookEndpointNotFound:
      description: No such webhook endpoint for this merchant, or it was deleted (`not_found`).
      x-error-codes: [not_found]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Idempotent-Replayed:
          $ref: '#/components/headers/IdempotentReplayed'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    WebhookLogNotFound:
      description: |
        No such webhook endpoint for this merchant, or it was deleted; or the endpoint has no
        such delivery, or no delivery of the `event_id` to replay (`not_found`).
      x-error-codes: [not_found]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Idempotent-Replayed:
          $ref: '#/components/headers/IdempotentReplayed'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    KeyInUse:
      description: A request with this Idempotency-Key is still running (`idempotency_key_in_use`).
      x-error-codes: [idempotency_key_in_use]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    KeyReused:
      description: The Idempotency-Key was used for a different request (`idempotency_key_reused`).
      x-error-codes: [idempotency_key_reused]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: The body is over 64 KiB (`payload_too_large`).
      x-error-codes: [payload_too_large]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: The body isn't JSON (`unsupported_media_type`).
      x-error-codes: [unsupported_media_type]
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Idempotent-Replayed:
          $ref: '#/components/headers/IdempotentReplayed'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    CreateOrder:
      type: object
      additionalProperties: false
      required: [items, currency, shipping_address, payment_method]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/LineItem'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: ISO 4217 code with a minor unit (not XAU, XTS, XXX).
        shipping_address:
          $ref: '#/components/schemas/Address'
        payment_method:
          type: string
          pattern: '^pm_[a-z0-9_]{1,64}$'
          description: A payment method token. The simulator declines pm_card_declined, pm_card_insufficient_funds and pm_card_expired.
        merchant_reference:
          type: string
          pattern: '^[!-~]{1,128}$'
          description: |
            The merchant's own id for the order, such as a cart or order number: 1-128 printable
            ASCII characters without spaces. Optional, and unique per merchant; a second order with
            the same reference is refused with 409 `order_reference_in_use`.
    CreateRefund:
      type: object
      additionalProperties: false
      description: Exactly one of `amount` and `lines`.
      properties:
        amount:
          type: integer
          minimum: 1
          maximum: 99999999
          description: Minor units of the order's currency.
        lines:
          type: array
          minItems: 1
          maxItems: 50
          description: The goods given back, each sku at most once and on the order.
          items:
            $ref: '#/components/schemas/RefundLine'
    RefundLine:
      type: object
      additionalProperties: false
      required: [sku, quantity]
      properties:
        sku:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,64}$'
        quantity:
          type: integer
          minimum: 1
          maximum: 1000
    Refund:
      type: object
      additionalProperties: false
      required: [id, order_id, state, amount, currency, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        state:
          type: string
          enum: [PENDING, SUCCEEDED, FAILED]
          description: >-
            `PENDING` until the provider answers; then `SUCCEEDED`, or `FAILED` when the provider
            refused it, which gives its share back.
        amount:
          type: integer
          description: Minor units returned to the customer; for a line refund, the lines' share.
        currency:
          type: string
        lines:
          type: array
          description: Present for a refund of goods.
          items:
            $ref: '#/components/schemas/RefundLine'
        failure:
          type: object
          additionalProperties: false
          required: [code, message]
          description: Present when the refund `FAILED`.
          properties:
            code:
              type: string
            message:
              type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    LineItem:
      type: object
      additionalProperties: false
      required: [sku, quantity, unit_amount]
      properties:
        sku:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,64}$'
        quantity:
          type: integer
          minimum: 1
          maximum: 1000
        unit_amount:
          type: integer
          minimum: 1
          maximum: 99999999
    Address:
      type: object
      additionalProperties: false
      required: [name, line1, city, postal_code, country]
      properties:
        name:
          type: string
          maxLength: 200
        line1:
          type: string
          maxLength: 200
        line2:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 100
        postal_code:
          type: string
          pattern: '^[A-Za-z0-9 -]{1,20}$'
        country:
          type: string
          pattern: '^[A-Z]{2}$'
    Order:
      type: object
      additionalProperties: false
      required:
        [id, state, amount, currency, items, shipping_address, payment_method, cancel_requested,
         refunds, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        merchant_reference:
          type: string
          description: Present when the order was created with one.
        state:
          $ref: '#/components/schemas/OrderState'
        amount:
          type: integer
          description: Total in minor units, computed from the items.
        currency:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/LineItem'
        shipping_address:
          $ref: '#/components/schemas/Address'
        payment_method:
          type: string
        cancel_requested:
          type: boolean
        payment:
          type: object
          additionalProperties: false
          required: [id, captured_amount, refunded_amount]
          properties:
            id:
              type: string
            captured_amount:
              type: integer
            refunded_amount:
              type: integer
        shipment:
          type: object
          additionalProperties: false
          required: [id, tracking_number]
          properties:
            id:
              type: string
            tracking_number:
              type: string
        failure:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                [out_of_stock, inventory_rejected, payment_declined, capture_failed,
                 shipping_failed, step_timeout]
            message:
              type: string
        refunds:
          type: object
          additionalProperties: false
          required: [data, has_more, pending_amount]
          description: >-
            The order's newest refunds, read in the same snapshot as the order, so they always
            agree with `payment.refunded_amount` and `state`. `GET /v1/orders/{id}/refunds` lists
            all of them.
          properties:
            data:
              type: array
              maxItems: 10
              description: Up to the ten newest refunds, newest first, in every state.
              items:
                $ref: '#/components/schemas/Refund'
            has_more:
              type: boolean
              description: True when the order has older refunds than `data` shows.
            pending_amount:
              type: integer
              minimum: 0
              description: >-
                Minor units that `PENDING` refunds are returning, on top of
                `payment.refunded_amount`.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    OrderState:
      type: string
      enum:
        [PENDING, INVENTORY_RESERVED, PAYMENT_AUTHORIZED, PAYMENT_CAPTURED, COMPLETED,
         CANCELLING_SHIPMENT, REVERSING_PAYMENT, RELEASING_INVENTORY, FAILED, CANCELLED,
         PARTIALLY_REFUNDED, REFUNDED]
      description: >-
        `PARTIALLY_REFUNDED` is a completed order some but not all of whose capture has been
        refunded; like `COMPLETED` it changes only when another refund is made.
    OrderList:
      type: object
      additionalProperties: false
      required: [data, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        has_more:
          type: boolean
        next_cursor:
          type: string
          description: Present exactly when `has_more` is true.
    TimelineEntry:
      type: object
      additionalProperties: false
      required: [seq, event_type, state, occurred_at]
      properties:
        seq:
          type: integer
        event_type:
          type: string
          description: >-
            `order.<state>` when the order changed state, `order.cancel_requested`, or one of
            `refund.created`, `refund.succeeded` and `refund.failed` for one of its refunds. A
            refund that succeeds is followed by the order's `order.partially_refunded` or
            `order.refunded`.
        state:
          type: string
          description: The order's state when the event happened.
        failure_code:
          type: string
          description: Why the order failed, on the event that failed it.
        refund:
          type: object
          additionalProperties: false
          required: [id, amount]
          description: Present on a `refund.*` event.
          properties:
            id:
              type: string
              format: uuid
            amount:
              type: integer
              description: Minor units the refund returns.
            failure_code:
              type: string
              description: Why the provider refused it, on `refund.failed`.
        occurred_at:
          type: string
          format: date-time
    WebhookEventType:
      type: string
      description: |
        An event type an endpoint can subscribe to, or `*` for every type. Each is an event the
        order's stream carries: `order.created`, `order.cancel_requested`, one per state the
        order can move to, and one per refund change.
      enum:
        ['*', order.created, order.cancel_requested, order.inventory_reserved,
         order.payment_authorized, order.payment_captured, order.completed,
         order.cancelling_shipment, order.reversing_payment, order.releasing_inventory,
         order.failed, order.cancelled, order.partially_refunded, order.refunded,
         refund.created, refund.succeeded, refund.failed]
    CreateWebhookEndpoint:
      type: object
      additionalProperties: false
      required: [url, enabled_events]
      properties:
        url:
          type: string
          maxLength: 2048
          description: |
            An absolute `https` (or `http`) URL with a host, without a user name, password or
            fragment. Scheme and host are stored lowercase.
        enabled_events:
          type: array
          minItems: 1
          maxItems: 32
          description: '`["*"]` alone, or event types; repeats are dropped.'
          items:
            $ref: '#/components/schemas/WebhookEventType'
        description:
          type: string
          maxLength: 256
    UpdateWebhookEndpoint:
      type: object
      additionalProperties: false
      properties:
        url:
          type: string
          maxLength: 2048
        enabled_events:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: '#/components/schemas/WebhookEventType'
        description:
          type: string
          maxLength: 256
          description: An empty string clears it.
        state:
          type: string
          enum: [ENABLED, DISABLED]
    WebhookEndpoint:
      type: object
      additionalProperties: false
      required: [id, url, enabled_events, state, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
        description:
          type: string
          description: Present when one was given.
        enabled_events:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: '#/components/schemas/WebhookEventType'
        state:
          type: string
          enum: [ENABLED, DISABLED]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreatedWebhookEndpoint:
      type: object
      additionalProperties: false
      required: [id, url, enabled_events, state, secret, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
        description:
          type: string
          description: Present when one was given.
        enabled_events:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: '#/components/schemas/WebhookEventType'
        state:
          type: string
          enum: [ENABLED, DISABLED]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        secret:
          type: string
          pattern: '^whsec_[A-Za-z0-9_-]{43}$'
          description: The signing secret. Shown only in this answer.
    WebhookDeliveryState:
      type: string
      enum: [PENDING, SUCCEEDED, FAILED]
      description: >-
        `PENDING` until a 2xx answer (`SUCCEEDED`) or until its retries run out (`FAILED`), 3
        days after it was created or replayed. A ping is `FAILED` after one attempt without a
        2xx.
    WebhookAttempt:
      type: object
      additionalProperties: false
      required: [attempted_at, latency_ms]
      description: Exactly one of `response_status` and `error` is present.
      properties:
        attempted_at:
          type: string
          format: date-time
        latency_ms:
          type: integer
          minimum: 0
          description: From the address lookup to the end of the answer, or to the failure.
        response_status:
          type: integer
          minimum: 100
          maximum: 599
        response_body:
          type: string
          maxLength: 1024
          description: The start of the answer's body, at most 1,024 characters.
        error:
          type: string
          maxLength: 512
          description: |
            Why there was no answer, as `<code>: <detail>`; the code is one of `address_refused`,
            `dns`, `connect`, `tls`, `timeout`, `protocol`, `io`, `secret`, `internal` or
            `shutdown`.
    WebhookDelivery:
      type: object
      additionalProperties: false
      required: [id, endpoint_id, event_id, event_type, state, attempts, created_at]
      properties:
        id:
          type: string
          format: uuid
        endpoint_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
          description: The event's id, also sent as `Payflow-Event-Id`.
        event_type:
          type: string
          description: One of the `WebhookEventType`s other than `*`, or `ping`.
        order_id:
          type: string
          format: uuid
          description: The order the event belongs to; absent on a ping.
        state:
          $ref: '#/components/schemas/WebhookDeliveryState'
        attempts:
          type: integer
          minimum: 0
          description: Attempts made so far, the one in flight included.
        next_attempt_at:
          type: string
          format: date-time
          description: |
            Present while `PENDING`: when it is next tried, or, while an attempt is in flight,
            until when that attempt holds it.
        created_at:
          type: string
          format: date-time
        replayed_at:
          type: string
          format: date-time
          description: When it was last replayed, if it was.
        last_attempt:
          $ref: '#/components/schemas/WebhookAttempt'
    WebhookDeliveryDetail:
      type: object
      additionalProperties: false
      required:
        [id, endpoint_id, event_id, event_type, state, attempts, created_at, payload,
         attempt_log]
      properties:
        id:
          type: string
          format: uuid
        endpoint_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
          description: The event's id, also sent as `Payflow-Event-Id`.
        event_type:
          type: string
          description: One of the `WebhookEventType`s other than `*`, or `ping`.
        order_id:
          type: string
          format: uuid
          description: The order the event belongs to; absent on a ping.
        state:
          $ref: '#/components/schemas/WebhookDeliveryState'
        attempts:
          type: integer
          minimum: 0
          description: Attempts made so far, the one in flight included.
        next_attempt_at:
          type: string
          format: date-time
          description: |
            Present while `PENDING`: when it is next tried, or, while an attempt is in flight,
            until when that attempt holds it.
        created_at:
          type: string
          format: date-time
        replayed_at:
          type: string
          format: date-time
          description: When it was last replayed, if it was.
        last_attempt:
          $ref: '#/components/schemas/WebhookAttempt'
        payload:
          type: object
          description: The event, as the body of every attempt carries it.
        attempt_log:
          type: array
          description: Every attempt, oldest first.
          items:
            $ref: '#/components/schemas/WebhookAttempt'
    WebhookDeliveryList:
      type: object
      additionalProperties: false
      required: [data, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDelivery'
        has_more:
          type: boolean
        next_cursor:
          type: string
          description: Present exactly when `has_more` is true.
    ReplayWebhookDeliveries:
      type: object
      additionalProperties: false
      description: |
        `event_id`, or a range with at least `created_gte`; not both.
      properties:
        event_id:
          type: string
          format: uuid
        created_gte:
          type: string
          format: date-time
        created_lt:
          type: string
          format: date-time
        state:
          type: array
          description: Only deliveries in these states; both when absent.
          items:
            type: string
            enum: [SUCCEEDED, FAILED]
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code:
              type: string
              description: Stable; see the top-level description and each response's `x-error-codes`.
              enum:
                [invalid_argument, invalid_cursor, unauthenticated, not_found, method_not_allowed,
                 not_acceptable, order_not_cancellable, order_not_refundable,
                 order_reference_in_use, refund_exceeds_captured, refund_exceeds_purchased,
                 webhook_endpoint_limit_reached, idempotency_key_in_use, payload_too_large,
                 unsupported_media_type, idempotency_key_reused, internal, unavailable]
            message:
              type: string
            request_id:
              type: string

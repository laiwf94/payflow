spring:
  application:
    name: payflow
  main:
    banner-mode: off
  datasource:
    url: ${PAYFLOW_DB_URL:jdbc:postgresql://localhost:5432/payflow}
    username: ${PAYFLOW_DB_USER:payflow}
    password: ${PAYFLOW_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${PAYFLOW_DB_POOL:20}
      connection-timeout: 5000
  flyway:
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
  kafka:
    bootstrap-servers: ${PAYFLOW_KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        linger.ms: 5
        max.block.ms: 5000
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        isolation.level: read_committed
    listener:
      ack-mode: record
server:
  port: ${PAYFLOW_PORT:8080}
payflow:
  simulator:
    enabled: ${PAYFLOW_SIMULATOR_ENABLED:true}
    key: ${PAYFLOW_SIMULATOR_KEY:}

spring:
  application:
    name: payflow
  main:
    banner-mode: off
  datasource:
    url: ${PAYFLOW_DB_URL:jdbc:postgresql://localhost:5432/payflow}
    username: ${PAYFLOW_DB_USER:payflow}
    password: ${PAYFLOW_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${PAYFLOW_DB_POOL:20}
      connection-timeout: 5000
  flyway:
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${PAYFLOW_PORT:8080}
payflow:
  simulator:
    enabled: ${PAYFLOW_SIMULATOR_ENABLED:true}
    key: ${PAYFLOW_SIMULATOR_KEY:}

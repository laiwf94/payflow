spring:
  application:
    name: payflow
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${PAYFLOW_DB_URL:jdbc:postgresql://localhost:5432/payflow}
    username: ${PAYFLOW_DB_USER:payflow}
    password: ${PAYFLOW_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${PAYFLOW_DB_POOL:20}
      connection-timeout: 5000
  flyway:
    locations: classpath:db/migration
    # Flyway's default lock is an advisory lock held in an open transaction, and CREATE INDEX
    # CONCURRENTLY waits for every open transaction, so it would wait for Flyway forever. A
    # session-level lock still keeps two starting instances from migrating at once.
    postgresql:
      transactional-lock: false
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
      fail-on-null-for-primitives: true
    mapper:
      allow-coercion-of-scalars: false
  kafka:
    bootstrap-servers: ${PAYFLOW_KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        linger.ms: 5
        max.block.ms: 5000
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        isolation.level: read_committed
        # A consumer that died keeps its partitions until this runs out; 10 s instead of the
        # 45 s default lets a restarted instance catch up sooner.
        session.timeout.ms: 10000
        heartbeat.interval.ms: 3000
    listener:
      ack-mode: record
server:
  port: ${PAYFLOW_PORT:8080}
payflow:
  api-keys: ${PAYFLOW_API_KEYS:}
  # Signs the order listing's cursors. Every instance needs the same value; a comma-separated list
  # rotates it (the first signs, all verify). Unset means a random per-process secret.
  cursor-secrets: ${PAYFLOW_CURSOR_SECRETS:}
  # Seals the secrets payflow stores and reads back, such as webhook signing secrets (AES-256-GCM).
  # id:base64key with a 32-byte key; a comma-separated list rotates it (the first seals, all
  # open). Every instance needs the same list. Unset means a random per-process key, and those
  # secrets are unreadable after a restart.
  secret-keys: ${PAYFLOW_SECRET_KEYS:}
  webhooks:
    # Networks webhooks may go to although they aren't public, as a comma-separated CIDR list
    # (172.18.0.0/16,::1/128); only for a development stack whose merchant server is on a private
    # network. Empty means public addresses only.
    allowed-networks: ${PAYFLOW_WEBHOOK_ALLOWED_NETWORKS:}
  simulator:
    enabled: ${PAYFLOW_SIMULATOR_ENABLED:true}
    key: ${PAYFLOW_SIMULATOR_KEY:}
management:
  server:
    # Metrics and health details stay off the public port; set PAYFLOW_MANAGEMENT_ADDRESS=0.0.0.0
    # only where the network already limits who can reach it.
    port: ${PAYFLOW_MANAGEMENT_PORT:8081}
    address: ${PAYFLOW_MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
        add-additional-paths: true
      group:
        # Kafka being down must not take the API out of rotation: orders are still accepted and
        # their events wait in the outbox. Readiness is the database only.
        readiness:
          include: readinessState,db
        # The version rides along on /livez (the "build" component, which is always up) so a
        # rolling deploy shows which instances run what. Nothing else is shown on the public port.
        liveness:
          include: livenessState,build
          show-components: always
          show-details: always
  metrics:
    tags:
      application: payflow
logging:
  structured:
    format:
      console: ${PAYFLOW_LOG_FORMAT:logstash}

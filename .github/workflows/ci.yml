name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      # Format, Error Prone and javac lint as errors, the whole test suite (Testcontainers uses
      # the runner's Docker), and the 90% line coverage floor.
      - name: Check
        run: ./gradlew check
      # The release workflow's SBOM generator, tested on its own and then run on this build's jar,
      # so a library the lockfile does not explain fails here rather than at release time.
      - name: SBOM
        run: |
          python3 -m unittest discover -s scripts
          python3 scripts/sbom.py --lockfile gradle.lockfile --jar build/libs/payflow.jar \
            --version 0.0.0-ci --output build/payflow.cdx.json
      - name: Coverage
        if: always()
        run: |
          python3 - <<'PY'
          import re
          x = open('build/reports/jacoco/test/jacocoTestReport.xml').read()
          missed, covered = map(int, re.findall(r'<counter type="LINE" missed="(\d+)" covered="(\d+)"/>', x)[-1])
          print(f"line coverage {covered / (missed + covered):.1%}")
          PY
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: build/reports/

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: Known vulnerabilities in locked dependencies
        run: |
          go run github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.6.0 \
            scan source --config osv-scanner.toml --lockfile gradle.lockfile

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t payflow:ci .
      - name: Runs as non-root
        run: test "$(docker image inspect payflow:ci --format '{{.Config.User}}')" = nonroot
